# Apenas instaladores nativos necessários ao tooling podem executar scripts.
allowBuilds:
  esbuild: true
  unrs-resolver: true

# drizzle-kit ainda carrega @esbuild-kit/core-utils, que fixa esbuild ~0.18 (GHSA-67mh-4wv8-2f99).
# A API usada (transform/transformSync) é compatível com 0.25; validado com db:migrate e db:generate.
overrides:
  "@esbuild-kit/core-utils>esbuild": "^0.25.0"
