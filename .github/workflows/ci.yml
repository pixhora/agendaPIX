name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Enable pnpm (corepack)
        run: corepack enable pnpm && pnpm --version
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "dir=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Bundle migrator
        run: pnpm build:migrate

  test-db:
    name: test:db (Postgres 17)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: agenda
          POSTGRES_USER: agenda
          # Banco descartável do CI, acessível só dentro do runner: sem senha.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agenda -d agenda"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://agenda@localhost:5432/agenda
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Enable pnpm (corepack)
        run: corepack enable pnpm && pnpm --version
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "dir=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Generate ephemeral test secrets
        run: |
          secret="$(openssl rand -base64 32)"; echo "::add-mask::$secret"; echo "BETTER_AUTH_SECRET=$secret" >> "$GITHUB_ENV"
          secret="$(openssl rand -hex 32)"; echo "::add-mask::$secret"; echo "FAKE_WEBHOOK_SECRET=$secret" >> "$GITHUB_ENV"
      - name: Apply migrations (drizzle-kit)
        run: pnpm db:migrate
      - run: pnpm test:db

  docker:
    name: docker image (build + smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: agenda
          POSTGRES_USER: agenda
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agenda -d agenda"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: agendapix:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run migrations from the image
        run: |
          docker run --rm --network host \
            -e DATABASE_URL=postgresql://agenda@localhost:5432/agenda \
            agendapix:ci node migrate.cjs
      - name: Start app container
        run: |
          docker run -d --name agendapix --network host \
            -e PORT=3000 \
            -e DATABASE_URL=postgresql://agenda@localhost:5432/agenda \
            -e BETTER_AUTH_URL=http://localhost:3000 \
            -e BETTER_AUTH_SECRET="$(openssl rand -base64 32)" \
            agendapix:ci
      - name: Smoke test HTTP
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/api/health && break
            sleep 1
          done
          echo
          curl -fsS http://localhost:3000/api/health | grep -q '"ok"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/)" = 200
          # Rota que consulta o banco: negócio inexistente deve responder 404 (não 500).
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/public/nao-existe/services)" = 404
          docker exec agendapix id -u | grep -qv '^0$'
          echo "Image size: $(docker image inspect agendapix:ci --format '{{.Size}}' | numfmt --to=iec)"
      - name: Wait for HEALTHCHECK
        run: |
          for i in $(seq 1 45); do
            status="$(docker inspect --format '{{.State.Health.Status}}' agendapix)"
            echo "health=$status"; [ "$status" = healthy ] && exit 0
            sleep 2
          done
          exit 1
      - name: Container logs
        if: always()
        run: docker logs agendapix || true

  audit:
    name: pnpm audit (prod, high)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Enable pnpm (corepack)
        run: corepack enable pnpm && pnpm --version
      - run: pnpm audit --prod --audit-level=high
