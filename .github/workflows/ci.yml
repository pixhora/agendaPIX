name: CI

on:
  push:
    branches: [master]
  # Todos os PRs (master e branches de integração como feat/backend), assim que o workflow existir na base.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Enable pnpm (corepack)
        run: corepack enable pnpm && pnpm --version
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "dir=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Bundle process entrypoints (migrate, reconcile)
        run: pnpm build:bundles

  test-db:
    name: test:db (Postgres 17)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: agenda
          POSTGRES_USER: agenda
          # Banco descartável do CI, acessível só dentro do runner: sem senha.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agenda -d agenda"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://agenda@localhost:5432/agenda
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Enable pnpm (corepack)
        run: corepack enable pnpm && pnpm --version
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "dir=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - name: Generate ephemeral test secrets
        run: |
          secret="$(openssl rand -base64 32)"; echo "::add-mask::$secret"; echo "BETTER_AUTH_SECRET=$secret" >> "$GITHUB_ENV"
          secret="$(openssl rand -hex 32)"; echo "::add-mask::$secret"; echo "FAKE_WEBHOOK_SECRET=$secret" >> "$GITHUB_ENV"
      - name: Apply migrations (per-file migrator)
        run: pnpm db:migrate
      - name: Migrator is idempotent
        run: pnpm db:migrate
      - run: pnpm test:db

  docker:
    name: docker image (build + smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: agenda
          POSTGRES_USER: agenda
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agenda -d agenda"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      # SMTP descartável para o /api/ready (verifica banco + transporte de email).
      mailpit:
        image: axllent/mailpit:v1.31
        ports:
          - 1025:1025
    steps:
      - uses: actions/checkout@v7
      - name: Lint Dockerfile (hadolint)
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: agendapix:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run migrations from the image (twice, second run is a no-op)
        run: |
          for _ in 1 2; do
            docker run --rm --network host \
              -e DATABASE_URL=postgresql://agenda@localhost:5432/agenda \
              agendapix:ci node migrate.cjs
          done
      - name: Start app container
        run: |
          docker run -d --name agendapix --network host \
            -e PORT=3000 \
            -e DATABASE_URL=postgresql://agenda@localhost:5432/agenda \
            -e BETTER_AUTH_URL=http://localhost:3000 \
            -e BETTER_AUTH_SECRET="$(openssl rand -base64 32)" \
            -e SMTP_HOST=localhost -e SMTP_PORT=1025 -e SMTP_SECURE=false \
            -e "SMTP_FROM=Agenda <ci@example.com>" \
            agendapix:ci
      - name: Smoke test HTTP
        run: |
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:3000/api/health && break
            sleep 1
          done
          echo
          curl -fsS http://localhost:3000/api/health | grep -q '"ok"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/)" = 200
          # /preview fecha em produção. A flag PREVIEW_ROUTES_ENABLED não vai na imagem.
          # /exemplo fica público: é a demonstração da landing, sem Pix real.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/preview)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/preview/booking)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/preview/painel)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/preview/motion)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/exemplo)" = 200
          curl -fsS http://localhost:3000/exemplo | grep -q "Demonstração com dados fictícios"
          # Rota que consulta o banco: negócio inexistente deve responder 404 (não 500).
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/public/nao-existe/services)" = 404
          # /api/ready (banco + SMTP) chega com o backend integrado (PR #4); antes disso responde 404.
          ready="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/ready)"
          echo "/api/ready -> $ready"
          if [ "$ready" != 404 ]; then test "$ready" = 200; fi
          docker exec agendapix id -u | grep -qv '^0$'
          echo "Image size: $(docker image inspect agendapix:ci --format '{{.Size}}' | numfmt --to=iec)"
      - name: Reconciliation worker
        run: |
          # reconcile.mjs só existe na imagem quando o backend traz scripts/reconcile.ts (PR #7).
          if ! docker run --rm --entrypoint test agendapix:ci -f /app/reconcile.mjs; then
            echo "reconcile.mjs ausente nesta versão; etapa ignorada"; exit 0
          fi
          # Uma passagem real contra o banco (provedor fake só fora de NODE_ENV=production).
          docker run --rm --network host \
            -e NODE_ENV=development \
            -e DATABASE_URL=postgresql://agenda@localhost:5432/agenda \
            -e PAYMENT_PROVIDER=fake -e FAKE_WEBHOOK_SECRET="$(openssl rand -hex 32)" \
            agendapix:ci node reconcile.mjs --once --json
          # Worker em loop, como no compose: precisa continuar de pé.
          docker run -d --name agendapix-worker --network host \
            -e DATABASE_URL=postgresql://agenda@localhost:5432/agenda \
            -e RECONCILE_INTERVAL_SECONDS=5 \
            agendapix:ci node reconcile.mjs
          sleep 12
          docker logs agendapix-worker
          test "$(docker inspect --format '{{.State.Running}}' agendapix-worker)" = true
          docker logs agendapix-worker 2>&1 | grep -q 'reconcile: loop'
      - name: Wait for HEALTHCHECK
        run: |
          for _ in $(seq 1 45); do
            status="$(docker inspect --format '{{.State.Health.Status}}' agendapix)"
            echo "health=$status"; [ "$status" = healthy ] && exit 0
            sleep 2
          done
          exit 1
      - name: Container logs
        if: always()
        run: |
          docker logs agendapix || true
          docker logs agendapix-worker 2>/dev/null || true

  e2e:
    name: test:e2e (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: agenda_e2e
          POSTGRES_USER: agenda
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agenda -d agenda_e2e"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      # Ver docs/E2E.md (PR #8). Playwright sobe next dev em 127.0.0.1:3344.
      DATABASE_URL: postgresql://agenda@localhost:5432/agenda_e2e
      BETTER_AUTH_URL: http://127.0.0.1:3344
      PAYMENT_PROVIDER: fake
      CI: "true"
    steps:
      - uses: actions/checkout@v7
      - name: Detect full e2e suite
        id: suite
        run: |
          if [ -f tests/e2e/global-setup.ts ] && [ -f docs/E2E.md ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
            echo "Suíte e2e completa ainda não chegou a esta branch (só o esqueleto). Etapa ignorada."
          fi
      - uses: actions/setup-node@v7
        if: steps.suite.outputs.full == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Enable pnpm (corepack)
        if: steps.suite.outputs.full == 'true'
        run: corepack enable pnpm && pnpm --version
      - name: Locate pnpm store
        if: steps.suite.outputs.full == 'true'
        id: pnpm-store
        run: echo "dir=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        if: steps.suite.outputs.full == 'true'
        with:
          path: ${{ steps.pnpm-store.outputs.dir }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - name: Install dependencies
        if: steps.suite.outputs.full == 'true'
        run: pnpm install --frozen-lockfile
      - name: Install Chromium (Playwright)
        if: steps.suite.outputs.full == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Generate ephemeral e2e secrets
        if: steps.suite.outputs.full == 'true'
        run: |
          secret="$(openssl rand -base64 32)"; echo "::add-mask::$secret"; echo "BETTER_AUTH_SECRET=$secret" >> "$GITHUB_ENV"
          secret="$(openssl rand -hex 32)"; echo "::add-mask::$secret"; echo "FAKE_WEBHOOK_SECRET=$secret" >> "$GITHUB_ENV"
          secret="$(openssl rand -hex 32)"; echo "::add-mask::$secret"; echo "PIX_KEY_ENCRYPTION_KEY=$secret" >> "$GITHUB_ENV"
      - name: Apply migrations
        if: steps.suite.outputs.full == 'true'
        run: pnpm db:migrate
      - name: Run Playwright e2e
        if: steps.suite.outputs.full == 'true'
        run: pnpm test:e2e
      - name: Legal pages with the publication flag
        run: pnpm exec playwright test --config=playwright.legal.config.ts
      - name: Install WebKit (Playwright)
        if: steps.suite.outputs.full == 'true'
        run: pnpm exec playwright install --with-deps webkit
      - name: Run motion preview on WebKit
        if: steps.suite.outputs.full == 'true'
        run: pnpm exec playwright test --config=playwright.motion.config.ts --project=webkit
      - name: Upload Playwright report
        if: failure() && steps.suite.outputs.full == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  audit:
    name: pnpm audit (prod, high)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Enable pnpm (corepack)
        run: corepack enable pnpm && pnpm --version
      - run: pnpm audit --prod --audit-level=high
